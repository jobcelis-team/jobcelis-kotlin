# Builds and signs the publication that Release uploads to Maven Central, without
# uploading it, and checks it against Central's rules. A pull request that would
# break publishing fails here instead of at release time. Signs with a throwaway
# key, so it needs no secrets.
name: Check release

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: "22"
          distribution: "temurin"

      - name: Throwaway signing key
        run: gpg --batch --passphrase ci-check --quick-gen-key "CI check" rsa3072 sign 1d

      - name: Build and sign (no upload)
        run: |
          export ORG_GRADLE_PROJECT_signingInMemoryKey="$(gpg --batch --pinentry-mode loopback --passphrase ci-check --armor --export-secret-keys)"
          export ORG_GRADLE_PROJECT_signingInMemoryKeyPassword=ci-check
          ./gradlew publishToMavenLocal -Dmaven.repo.local="$RUNNER_TEMP/m2" --no-daemon --no-configuration-cache

      - name: Check the publication
        run: |
          VERSION=$(grep -m1 '^version = ' build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          DIR=com/jobcelis/jobcelis-kotlin
          mkdir -p "$RUNNER_TEMP/bundle/$DIR"
          cp -R "$RUNNER_TEMP/m2/$DIR/$VERSION" "$RUNNER_TEMP/bundle/$DIR/"
          .github/scripts/check-central-bundle.sh "$RUNNER_TEMP/bundle" com.jobcelis jobcelis-kotlin "$VERSION"
