# Keeps the build and publishing tools current, so a release never fails on an
# outdated plugin or action. Monthly, one grouped pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    groups:
      dependencies:
        patterns: ["*"]
